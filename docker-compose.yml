version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agrovia?schema=public
      - JWT_SECRET=production-hardened-strong-secret-key-42
      - PORT=3000
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agrovia
    ports:
      - "5432:5432"
    volumes:
      - agrovia_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  agrovia_pgdata:
